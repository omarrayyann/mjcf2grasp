version: v2
budget: ai2/prior
description: Objaverse Grasp Generation Pipeline
tasks:
  # We only have one step in our experiment, so there's only one entry in this list
  - name: Objaverse-Grasp-Generation
    image:
      beaker: yejink/thor-grasp-generation2
    command: [
        '/bin/bash',
        '/root/yejink/thor-grasp/run_objaverse_pipeline.sh',
        '/root/datasets/mujoco-thor/assets/objects/objaverse/'
        #'/root/datasets/mujoco-thor/assets/scenes/procthor-100k-debug'
      ]
    envVars:
      - name: WANDB_API_KEY
        secret: wandb-api-key
    datasets:
    - mountPath: '/root'
      source:
        weka: prior-default
    resources:
      gpuCount: 1
    constraints:
      cluster: [ ai2/rhea ]
    context:
      priority: normal