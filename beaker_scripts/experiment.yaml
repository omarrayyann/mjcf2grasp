version: v2
budget: ai2/prior
description: Objavers Grasp Generation Pipeline
tasks:
  # We only have one step in our experiment, so there's only one entry in this list
  - name: Objaverse-Grasp-Generation
    image:
      beaker: yejink/thor-grasp-generation2
    command: [
        '/bin/bash',
        '/root/thor-grasp/run_objaverse_pipeline.sh',
      ]
    envVars:
      - name: WANDB_API_KEY
        secret: wandb-api-key
    datasets:
    - mountPath: '/data/prior-default'
      subPath: 'yejink'
      source:
        weka: prior-default
    resources:
      gpuCount: 0
    constraints:
      cluster: [ ai2/neptune ]
